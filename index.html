<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<style>*,::before,::after{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <img class="mark" src="icon-192.png" alt="" width="44" height="44">
      <div><h1>Nido</h1><div class="sub">el dinero de los Díaz Novel</div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="inicio" aria-selected="true"><span class="nic" aria-hidden="true">🐷</span>Inicio</button>
    <button role="tab" data-t="presupuesto" aria-selected="false"><span class="nic" aria-hidden="true">🧮</span>Presupuesto</button>
    <button role="tab" data-t="mes" aria-selected="false"><span class="nic" aria-hidden="true">📅</span>Este mes</button>
    <button role="tab" data-t="movs" aria-selected="false"><span class="nic" aria-hidden="true">🧾</span>Movimientos</button>
    <button role="tab" data-t="historico" aria-selected="false"><span class="nic" aria-hidden="true">📊</span>Histórico</button>
    <button role="tab" data-t="ahorro" aria-selected="false"><span class="nic" aria-hidden="true">🎯</span>Ahorro</button>
    <button role="tab" data-t="altovelo" aria-selected="false"><span class="nic" aria-hidden="true">🏡</span>Altovelo</button>
  </nav>
    <div class="side-foot">
      <button class="btn soft" id="go-import" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Subir extracto</button>
      <span class="status" id="status">Cargando…</span>
    </div>
  </aside>
  <div class="content">
    <header class="topbar"><div class="tt"><span class="pic" id="page-ic" aria-hidden="true">🐷</span><h2 id="page-title">Inicio</h2></div><span class="small muted" id="hoy"></span></header>
    <main id="main"><div class="empty">Cargando vuestros números…</div></main>
  </div>
</div>
<script>try{const _h=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});document.getElementById("hoy").textContent=_h.charAt(0).toUpperCase()+_h.slice(1);}catch(e){}</script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});}</script>
</body>
</html>
