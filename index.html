<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f422e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<style>*,::before,::after{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <img class="mark" src="icon-192.png" alt="" width="44" height="44">
      <div><h1>Nido</h1><div class="sub">el dinero de los Díaz Novel</div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="inicio" aria-selected="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3l7 6.5V17h-5v-4.5H8V17H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Inicio</button>
    <button role="tab" data-t="presupuesto" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h12v14H4zM7 7h6M7 10h6M7 13h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Presupuesto</button>
    <button role="tab" data-t="mes" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14v12H3zM3 9h14M7 3v4M13 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Este mes</button>
    <button role="tab" data-t="movs" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Movimientos</button>
    <button role="tab" data-t="historico" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M8 16V5M12 16v-6M16 16V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Histórico</button>
    <button role="tab" data-t="ahorro" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15l4-4 3 3 7-8M12 6h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Ahorro</button>
  </nav>
    <div class="side-foot">
      <button class="btn soft" id="go-import" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Subir extracto</button>
      <span class="status" id="status">Cargando…</span>
    </div>
  </aside>
  <div class="content">
    <header class="topbar"><h2 id="page-title">Inicio</h2><span class="small muted" id="hoy"></span></header>
    <main id="main"><div class="empty">Cargando vuestros números…</div></main>
  </div>
</div>
<script>try{const _h=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});document.getElementById("hoy").textContent=_h.charAt(0).toUpperCase()+_h.slice(1);}catch(e){}</script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
