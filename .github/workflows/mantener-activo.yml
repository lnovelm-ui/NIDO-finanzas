# Hace una consulta mínima a la base de datos de Nido cada tres días
# para que Supabase (plan gratuito) no pause el proyecto por inactividad.
# No lee ni modifica ningún dato: solo llama a la función ping(), que devuelve 1.
name: Mantener Nido activo
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          curl -fsS -X POST "https://vaqbeirrqtdcpzolxpap.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_yiuLOOWVwbTRT65Llr2PCw_HtjFDxIC" \
            -H "Content-Type: application/json" -d '{}'
